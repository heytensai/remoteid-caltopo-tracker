rate_limit: 5
logging: 'INFO'
caltopo_url: 'https://caltopo.com/api/v1/position/report/<your_key_here>'
# BPF filter for WiFi capture. Filters at the kernel level for performance.
# Must match both beacons (subtype 8, used by Autel/DJI/Skydio) and
# action frames (subtype 13, used by WiFi NaN). If compilation fails,
# the decoder will exit — make sure the interface is in monitor mode.
filter: "type mgt subtype beacon or type mgt subtype action"
#database: 'archive.db'
ignore:
  - "<your_uas_id_here>"

# if set, only the following UAS IDs will be monitored
#allow:
#  - "<your_uas_id_here>"

# map UAS IDs to custom display names
#alias:
#  "<original_uas_id>": "<custom_name>"

